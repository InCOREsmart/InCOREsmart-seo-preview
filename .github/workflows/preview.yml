name: Build SEO preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Checkout SEO branch
        uses: actions/checkout@v4
        with:
          repository: InCOREsmart/InCOREsmart.github.io
          ref: seo-ai-foundation
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Build for repository preview
        working-directory: source
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npx tsc
          npx vite build --base=/InCOREsmart-seo-preview/
          node scripts/copy-spa-routes.mjs

          # Project Pages is served under /InCOREsmart-seo-preview/.
          # Static SEO pages use root-relative links, so rewrite those links
          # in the preview artifact without changing production source URLs.
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const base = '/InCOREsmart-seo-preview/';
          async function walk(dir) {
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              const file = join(dir, entry.name);
              if (entry.isDirectory()) await walk(file);
              else if (entry.isFile() && file.endsWith('.html')) {
                const original = await readFile(file, 'utf8');
                const updated = original.replace(/(href|src)="\/(?!\/)/g, '$1="' + base);
                if (updated !== original) await writeFile(file, updated);
              }
            }
          }
          await walk('dist');
          NODE

          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add --detach /tmp/gh-pages origin/gh-pages
          else
            mkdir -p /tmp/gh-pages
            git init /tmp/gh-pages
            cd /tmp/gh-pages
            git checkout --orphan gh-pages
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          find /tmp/gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/source/dist/." /tmp/gh-pages/
          touch /tmp/gh-pages/.nojekyll
          cd /tmp/gh-pages
          git add -A
          git commit -m "Preview ${GITHUB_SHA}" || exit 0
          git push origin HEAD:gh-pages
